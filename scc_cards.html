html+=d?`<div class="discipline"><div class="yellow"><b>${d.yellow.team}</b> Yellow</div><div class="second"><b>${d.second_yellow_red.team}</b> Second-yellow red</div><div class="red"><b>${d.straight_red.team}</b> Straight red</div></div><p class="muted">Team totals over ${d.played} reported league games. Officials separately: ${d.yellow.officials} yellow · ${d.second_yellow_red.officials} second-yellow red · ${d.straight_red.officials} straight red.</p>`:'<p class="empty">Discipline totals unavailable for this opponent.</p>';
html+=`<h3>Common opponents <span class="muted">(${c.common_opponents.length})</span></h3>`;
if(c.common_opponents.length){html+='<div class="scroll"><table><thead><tr><th>Common opponent</th><th>Our results</th><th>Their results</th></tr></thead><tbody>'+c.common_opponents.map(o=>`<tr><td>${esc(o.name)}</td><td>${o.our_results.map(result).join('')}</td><td>${o.opponent_results.map(result).join('')}</td></tr>`).join('')+'</tbody></table></div>'}else html+='<p class="empty">No verified common-opponent results available in the tracked league.</p>';
html+='<p class="muted">Completed league games through the snapshot date; all meetings shown. Scores are from each team’s perspective. For past fixtures, this is current context rather than a historical pre-match assessment.</p><details><summary>Sources and fixture details</summary>'+link(g.source_url,'Match details')+(c.standings_source?link(c.standings_source,'League standings'):'')+(c.discipline_source?link(c.discipline_source,'Fairness / card totals'):'')+`<p>${esc(g.venue_text)}</p></details>`;$('card').innerHTML=html}
$('team').onchange=options;$('range').onchange=options;$('fixture').onchange=show;options();
